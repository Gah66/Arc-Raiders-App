name: Sync MetaForge Events Mirror for Web/iOS PWA

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch MetaForge Schedule & Push events-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const slugs = ["north-america", "europe", "oceania"];
            (async () => {
              const regions = {};
              for (const s of slugs) {
                const res = await fetch("https://metaforge.app/api/arc-raiders/events-schedule?region=" + s);
                if (!res.ok) throw new Error(s + " HTTP " + res.status);
                const json = await res.json();
                regions[s] = Array.isArray(json.data) ? json.data : [];
              }
              fs.mkdirSync("events-out", { recursive: true });
              fs.writeFileSync("events-out/events.json", JSON.stringify({ updatedAt: new Date().toISOString(), regions }));
              console.log("Fetched regions:", Object.keys(regions).map(k => k + "=" + regions[k].length).join(", "));
            })();
          '
          cd events-out
          git init -b events-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "chore: sync MetaForge events mirror"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:events-data
